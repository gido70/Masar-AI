<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Amiri;src:url(Amiri-Bold.ttf);font-weight:700}@font-face{font-family:Amiri;src:url(Amiri-Regular.ttf);font-weight:400}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}body{background:#FFFCF3;font-family:Amiri}.c{position:relative;width:1200px;height:630px;overflow:hidden;padding:56px 80px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.b1{position:absolute;width:520px;height:520px;border-radius:50%;background:#22B8C8;opacity:.18;filter:blur(30px);top:-220px;right:-140px}
.b2{position:absolute;width:480px;height:480px;border-radius:50%;background:#E7CF8E;opacity:.35;filter:blur(30px);bottom:-240px;left:-120px}
.logo{height:110px;position:relative}
h1{font-size:74px;color:#123E6B;line-height:1.3;position:relative}
h1 em{font-style:normal;color:#0E7C8C}
p{font-size:36px;color:#3F4A57;position:relative}
.chips{display:flex;gap:14px;margin-top:auto;position:relative}
.chips span{font-size:28px;font-weight:700;border-radius:999px;padding:6px 22px;background:#fff;color:#123E6B;box-shadow:0 0 0 2px #E2D8C3 inset}
.chips span.a{background:#123E6B;color:#fff;box-shadow:none}
</style></head><body><div class="c"><div class="b1"></div><div class="b2"></div>
<img class="logo" src="masar_logo.png">
<h1>تعلّم طريقًا واضحًا، <em>واخرج بعمل حقيقي</em></h1>
<p>حقائب تطبيقية بالعربية في الذكاء الاصطناعي</p>
<div class="chips"><span class="a">مسار الفيديو</span><span>مسار الذكاء الاصطناعي</span><span>أداة مجانية</span></div>
</div></body></html>
