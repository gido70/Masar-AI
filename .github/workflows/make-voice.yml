name: الأصوات (WaveSpeed ElevenLabs — مدفوع)

on:
  workflow_dispatch:
    inputs:
      production:
        description: "اسم مجلد الإنتاج"
        required: true
      config:
        description: "ملف الإعداد داخل المجلد"
        required: true
        default: voice.json
      max_chars:
        description: "أقصى عدد أحرف"
        required: true
        default: "6000"

concurrency:
  group: voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: حارس الرصيد (يوقف التشغيل إن لم يكفِ الرصيد · سجل 314)
        env:
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          FLOOR: "0"
          MARGIN: "1.00"
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $WAVESPEED_API_KEY" https://api.wavespeed.ai/api/v3/balance)
          python3 - "$RESP" <<'PY'
          import json, os, sys
          try:
              bal = float(json.loads(sys.argv[1])["data"]["balance"])
          except Exception as e:
              print("تعذّر قراءة الرصيد، فأوقفت التشغيل احتياطًا:", sys.argv[1][:200]); sys.exit(1)
          need = float(os.environ["FLOOR"]) + float(os.environ["MARGIN"])
          print(f"الرصيد الحالي: {bal:.2f}$ · المطلوب للتشغيل: {need:.2f}$ على الأقل")
          if bal < need:
              print("⛔ أوقفت التشغيل: الرصيد لا يكفي لهذا التشغيل."); sys.exit(1)
          PY
      - uses: actions/checkout@v4
      - name: توليد الأصوات
        env:
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          MAX_CHARS: ${{ inputs.max_chars }}
        run: python studio/make_voice.py "${{ inputs.production }}" "${{ inputs.config }}"
      - name: حفظ الأصوات في المستودع
        run: |
          git config user.name "Masar Factory"
          git config user.email "factory@users.noreply.github.com"
          git add "productions/${{ inputs.production }}/"*.mp3 2>/dev/null || true
          git commit -m "factory: voices for ${{ inputs.production }} (run ${{ github.run_number }})" || exit 0
          git pull --rebase -q && git push
