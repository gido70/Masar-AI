<html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:T;src:url(../../studio/fonts/Tajawal-Bold.ttf)}
*{box-sizing:border-box}body{margin:0;width:1280px;height:720px;overflow:hidden;background:#F9F1E4;font-family:T;position:relative;color:#1B1B2F}
.art{position:absolute;left:0;top:0;width:1280px;height:720px;background:url(ads-cover-art-gemini.jpg) left center/cover}
.fade{position:absolute;left:480px;top:0;width:200px;height:720px;background:linear-gradient(to right,rgba(249,241,228,0),#F9F1E4 92%)}
.cream{position:absolute;left:670px;right:0;top:0;bottom:0;background:#F9F1E4}
.line{position:absolute;left:0;right:0;height:8px;background:#B0186A}
.tx{position:absolute;right:58px;top:62px;width:560px}
.badges{display:flex;gap:12px}
.bd{background:#B0186A;color:#fff;font-size:25px;padding:6px 22px 4px;border-radius:24px}
.bd.o{background:transparent;color:#1B1B2F;border:3px solid #1B1B2F}
h1{font-size:92px;margin:16px 0 0;line-height:1.1;white-space:nowrap}h1 span{color:#B0186A}
.sub{font-size:40px;line-height:1.35;margin-top:8px}
.rl{width:120px;height:6px;background:#B0186A;margin:20px 0 14px}
.s2{font-size:28px;color:#5A5A70}
.chips{position:absolute;right:58px;width:560px;top:540px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ch{border:2.5px solid #1B1B2F;border-radius:12px;text-align:center;padding:5px 0 3px;font-size:19px;background:#fff}
.ch b{display:block;color:#B0186A;font-size:14px;line-height:1}
.ch.on{background:#B0186A;border-color:#B0186A;color:#fff}.ch.on b{color:#FFE3F0}
.logo{position:absolute;left:690px;top:470px;height:54px}
</style></head><body>
<div class="art"></div><div class="cream"></div><div class="fade"></div>
<div class="line" style="top:0"></div><div class="line" style="bottom:0"></div>
<div class="tx"><div class="badges"><span class="bd">حقيبة تطبيقية</span><span class="bd o">تسع وحدات · شهادة</span></div>
<h1>مسار <span>الإعلانات</span></h1>
<div class="sub">اصنع إعلانًا يقنع<br>بالذكاء الاصطناعي</div><div class="rl"></div>
<div class="s2">الفكرة قبل الأداة، من الموجز إلى البيع</div><img src="../../studio/assets/logo.png" style="height:48px;margin-top:14px"></div>

<div class="chips">
<div class="ch"><b>0</b>الفكرة</div><div class="ch"><b>1</b>الموجز</div><div class="ch"><b>2</b>الأفكار</div><div class="ch"><b>3</b>الاختيار</div><div class="ch"><b>4</b>اللقطات</div><div class="ch"><b>5</b>التوليد</div><div class="ch"><b>6</b>المونتاج</div><div class="ch"><b>7</b>النسخ</div><div class="ch on"><b>8 ◀</b>البيع</div>
</div></body></html>
