name: صورة المقدّم (WaveSpeed — مدفوع)

on:
  workflow_dispatch:
    inputs:
      production:
        description: "اسم مجلد الإنتاج (فيه image.json)"
        required: true
      max_total:
        description: "أقصى تكلفة تقديرية بالدولار"
        required: true
        default: "1"

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: حارس الرصيد (لا ينزل رصيد WaveSpeed عن 5000$ · سجل 308)
        env:
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          FLOOR: "5000"
          MARGIN: "1.00"
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $WAVESPEED_API_KEY" https://api.wavespeed.ai/api/v3/balance)
          python3 - "$RESP" <<'PY'
          import json, os, sys
          try:
              bal = float(json.loads(sys.argv[1])["data"]["balance"])
          except Exception as e:
              print("تعذّر قراءة الرصيد، فأوقفت التشغيل احتياطًا:", sys.argv[1][:200]); sys.exit(1)
          need = float(os.environ["FLOOR"]) + float(os.environ["MARGIN"])
          print(f"الرصيد الحالي: {bal:.2f}$ · المطلوب للتشغيل: {need:.2f}$ على الأقل")
          if bal < need:
              print("⛔ أوقفت التشغيل: الرصيد سينزل عن 5000$ المحجوزة للاسترداد."); sys.exit(1)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: توليد الصور
        env:
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          MAX_TOTAL: ${{ inputs.max_total }}
        run: python studio/make_image.py "${{ inputs.production }}"
      - name: حفظ الصور في المستودع
        run: |
          git config user.name "Masar Factory"
          git config user.email "factory@users.noreply.github.com"
          git add "productions/${{ inputs.production }}/"*.png 2>/dev/null || true
          git commit -m "factory: images for ${{ inputs.production }} (run ${{ github.run_number }})" || exit 0
          git pull --rebase -q && git push
