<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبارات حقيبة مسار الذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#123E6B;--teal:#0E7C8C;--turq:#22B8C8;--gold:#C9971F;--goldl:#E7CF8E;--bg:#FFFCF3;--body:#3F4A57;--mute:#6B7280;--line:#E2D8C3;--ok:#0E7C6B;--okbg:#E6F4F1;--bad:#A8492F;--badbg:#FBEDE8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Amiri,"Times New Roman",serif;font-size:19px;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1.5px solid var(--gold);padding-bottom:10px;margin-bottom:22px}
header img{height:54px}
header a{color:var(--teal);font-weight:700;text-decoration:none;font-size:16px}
h1{font-size:34px;line-height:1.3;margin:0 0 6px}
.sub{color:var(--body);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
label.name{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--navy)}
input[type=text]:focus{outline:2px solid var(--turq);border-color:var(--turq)}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--navy)}
.item:hover{border-color:var(--turq)}
.num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.item.key .num{background:var(--gold);color:var(--navy)}
.item b{display:block;font-size:20px}
.item span{color:var(--mute);font-size:16px}
.item .st{margin-inline-start:auto;font-size:15px;font-weight:700;color:var(--teal);white-space:nowrap}
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.q h3{margin:0 0 10px;font-size:21px;line-height:1.5}
.q h3 small{color:var(--gold);font-size:16px;margin-inline-end:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:8px;cursor:pointer}
.opt input{margin-top:9px;accent-color:var(--teal);flex:none}
.opt:has(input:checked){border-color:var(--teal);background:#F2FAF9}
.q.done .opt{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.exp{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:17px}
.exp.ok{background:var(--okbg);color:var(--ok)} .exp.no{background:var(--badbg);color:var(--bad)}
.btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 26px;cursor:pointer;text-decoration:none;text-align:center}
.btn.pri{background:var(--navy);color:#fff} .btn.pri:disabled{background:#9AA8B8;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.hint{color:var(--mute);font-size:16px}
.result{background:#fff;border:2px solid var(--gold);border-radius:18px;padding:22px;text-align:center;margin:18px 0}
.result .big{font-size:56px;font-weight:700;line-height:1.1}
.result .meta{color:var(--mute);font-size:16px}
.badge{display:inline-block;border-radius:999px;padding:4px 16px;font-weight:700;margin-top:8px}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.no{background:var(--badbg);color:var(--bad)}
.cmp{display:flex;justify-content:center;gap:28px;margin-top:12px}
.cmp div{min-width:110px} .cmp b{display:block;font-size:30px}
.tip{background:#FBF4E2;border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;font-size:17px}
footer{margin-top:30px;color:var(--mute);font-size:14px;text-align:center}
@media print{
  body{background:#fff} header a,.actions,.q,.no-print,footer{display:none!important}
  .result{border-width:2px;margin-top:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="masar_logo.png" alt="شعار مُسار">
    <a href="#" id="homeLink">جميع الاختبارات</a>
  </header>
  <main id="app"></main>
  <footer>مسار الذكاء الاصطناعي: من التشتت إلى قرار وتنفيذ ذكي · برنامج التدريب التطبيقي المستمر</footer>
</div>
<script src="questions.js"></script>
<script>
const PASS = 0.7;
const store = {
  get(k, d) { try { const v = localStorage.getItem("masar_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("masar_" + k, JSON.stringify(v)); } catch (e) {} }
};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtDate = d => new Date(d).toLocaleDateString("ar", { year: "numeric", month: "long", day: "numeric" });

function nameBox() {
  return `<div class="card"><label class="name" for="nm">اسم المتدرب</label>
  <input type="text" id="nm" placeholder="اكتب اسمك كما تريده أن يظهر في النتيجة" value="${esc(store.get("name", ""))}"></div>`;
}
function bindName() {
  const el = document.getElementById("nm");
  if (el) el.addEventListener("input", () => store.set("name", el.value.trim()));
}

function home() {
  const res = store.get("results", {});
  const order = ["pre", "unit1", "unit2", "unit3", "unit4", "unit5", "post"];
  const items = order.map((k, i) => {
    const z = QUIZZES[k], r = res[k];
    const n = k === "pre" ? "قبل" : k === "post" ? "بعد" : k.slice(4);
    const st = r ? `${r.score} من ${r.total}` : "لم يُجرَ بعد";
    return `<a class="item ${k === "pre" || k === "post" ? "key" : ""}" href="#${k}"><div class="num">${n}</div>
      <div><b>${z.title}</b><span>${z.ids.length} أسئلة · ${esc(z.sub.split(":")[0])}</span></div><div class="st">${st}</div></a>`;
  }).join("");
  app.innerHTML = `<h1>اختبارات الحقيبة</h1>
  <p class="sub">ابدأ بالاختبار القبلي، ثم اختبار كل وحدة بعد دراستها، واختم بالاختبار البعدي لترى مقدار تقدمك.</p>
  ${nameBox()}<div class="list">${items}</div>
  <p class="tip no-print">تُحفظ نتائجك على هذا الجهاز فقط. بعد الاختبار البعدي اضغط «حفظ النتيجة PDF» وأرسلها للمدرب.</p>`;
  bindName();
}

function quiz(key) {
  const z = QUIZZES[key];
  const qs = z.ids.map(id => ({ id, ...Q[id], opts: shuffle(Q[id].o.map((t, i) => ({ t, ok: i === 0 }))) }));
  app.innerHTML = `<h1>${z.title}</h1><p class="sub">${esc(z.sub)}</p>${nameBox()}
  <form id="f">${qs.map((q, i) => `<div class="q" data-i="${i}"><h3><small>${i + 1}.</small>${esc(q.q)}</h3>
    ${q.opts.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${esc(o.t)}</span></label>`).join("")}
  </div>`).join("")}
  <div class="actions"><button class="btn pri" id="sub" type="submit" disabled>تصحيح الإجابات</button>
  <span class="hint" id="cnt">أجب عن جميع الأسئلة (0 من ${qs.length})</span></div></form><div id="res"></div>`;
  bindName();
  const f = document.getElementById("f"), sub = document.getElementById("sub"), cnt = document.getElementById("cnt");
  f.addEventListener("change", () => {
    const n = qs.filter((_, i) => f.querySelector(`input[name=q${i}]:checked`)).length;
    sub.disabled = n < qs.length; cnt.textContent = n < qs.length ? `أجب عن جميع الأسئلة (${n} من ${qs.length})` : "جاهز للتصحيح";
  });
  f.addEventListener("submit", e => {
    e.preventDefault();
    let score = 0;
    qs.forEach((q, i) => {
      const box = f.querySelector(`.q[data-i="${i}"]`); box.classList.add("done");
      const picked = +f.querySelector(`input[name=q${i}]:checked`).value;
      const right = q.opts[picked].ok; if (right) score++;
      box.querySelectorAll(".opt").forEach((lab, j) => {
        lab.querySelector("input").disabled = true;
        if (q.opts[j].ok) lab.classList.add("right"); else if (j === picked) lab.classList.add("wrong");
      });
      box.insertAdjacentHTML("beforeend", `<div class="exp ${right ? "ok" : "no"}">${right ? "إجابة صحيحة. " : "الإجابة الصحيحة مظللة بالأخضر. "}${esc(q.e)}</div>`);
    });
    const res = store.get("results", {});
    res[key] = { score, total: qs.length, date: Date.now() };
    store.set("results", res);
    sub.remove(); cnt.remove();
    showResult(key, score, qs.length);
  });
}

function showResult(key, score, total) {
  const z = QUIZZES[key], name = store.get("name", "") || "متدرب";
  const pct = score / total, pass = pct >= PASS;
  const res = store.get("results", {});
  let extra = "";
  if (key === "post" && res.pre) {
    const d = score - res.pre.score;
    extra = `<div class="cmp"><div><span>القبلي</span><b>${res.pre.score}/${res.pre.total}</b></div>
      <div><span>البعدي</span><b>${score}/${total}</b></div>
      <div><span>التقدم</span><b dir="ltr" style="color:${d >= 0 ? "var(--ok)" : "var(--bad)"}">${d >= 0 ? "+" : ""}${d}</b></div></div>`;
  }
  const msg = key === "pre" ? `<span class="badge ok">سجّلنا نقطة البداية</span>`
    : pass ? `<span class="badge ok">أحسنت · اجتزت ${Math.round(PASS * 100)}٪ أو أكثر</span>`
           : `<span class="badge no">راجع الوحدة ثم أعد المحاولة</span>`;
  const next = { pre: "unit1", unit1: "unit2", unit2: "unit3", unit3: "unit4", unit4: "unit5", unit5: "post" }[key];
  document.getElementById("res").innerHTML = `<div class="result">
    <div class="meta">${esc(z.title)} · ${fmtDate(Date.now())}</div>
    <div style="font-size:24px;font-weight:700;margin-top:4px">${esc(name)}</div>
    <div class="big">${score} / ${total}</div>${msg}${extra}</div>
    <div class="actions">${key === "post" ? `<button class="btn pri" onclick="window.print()">حفظ النتيجة PDF</button>` : ""}
    <a class="btn sec" href="#${key}" onclick="setTimeout(route,0)">إعادة المحاولة</a>
    ${next ? `<a class="btn ${key === "post" ? "sec" : "pri"}" href="#${next}">${QUIZZES[next].title} ←</a>` : ""}
    <a class="btn sec" href="#">كل الاختبارات</a></div>`;
  document.getElementById("res").scrollIntoView({ behavior: "smooth" });
}

function route() {
  const k = location.hash.replace("#", "");
  window.scrollTo(0, 0);
  if (QUIZZES[k]) quiz(k); else home();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
